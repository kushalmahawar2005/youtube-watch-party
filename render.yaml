# Render Blueprint: one web service serves the React build + API + WebSocket on the same URL.
services:
  - type: web
    name: youtube-watch-party
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: YOUTUBE_API_KEY
        sync: false # set the value in the Render dashboard
